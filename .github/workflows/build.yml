name: Build Convertor

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    strategy:
      matrix:
        include:
          - os: windows-latest
            name: windows
          - os: macos-latest
            name: mac
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-dev.txt

      - name: Build with PyInstaller
        run: python -m PyInstaller Convertor.spec --noconfirm --clean

      - name: Zip Mac app
        if: runner.os == 'macOS'
        run: |
          cd dist
          ditto -c -k --sequesterRsrc --keepParent Convertor.app Convertor-mac.zip

      - name: Zip Windows app
        if: runner.os == 'Windows'
        run: |
          cd dist
          7z a Convertor-windows.zip Convertor
        shell: bash

      - name: Upload Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: Convertor-${{ matrix.name }}
          path: |
            dist/Convertor-mac.zip
            dist/Convertor-windows.zip